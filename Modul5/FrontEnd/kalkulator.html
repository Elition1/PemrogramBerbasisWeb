<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 5</title>
    <link rel="stylesheet" href="../FrontEnd/kalkulator.css">
</head>
<body>
    <div id="calculator">
        <input id="display" readonly>
        <div id="keys">    
            <button onclick="appendToDisplay('+')">+</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('-')">-</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('*')">*</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('/')">/</button>
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="calculate()">=</button>
            <button onclick="appendToDisplay('.')">.</button>
        </div>
    </div>
    <script>        
        let displayElemen = document.getElementById('display');

        function mathEval (exp) {
            var reg = /(?:[a-z$_][a-z0-9$_]*)|(?:[;={}\[\]"'!&<>^\\?:])/ig,
                valid = true;
            

            exp = exp.replace(reg, function ($0) {
                if (Math.hasOwnProperty($0))
                    return "Math."+$0;
                else
                    valid = false;
            });
            
            // Don't eval if our replace function flagged as invalid
            if (!valid)
                displayElemen.value = "Invalid";
            else
                try { displayElemen.value = eval(displayElemen.value); } catch (e) { displayElemen.value = "Invalid"; };
        }

        function appendToDisplay(elemen)
        {
            displayElemen.value += elemen;
        }

        function clearDisplay()
        {
            displayElemen.value = "";
        }

        function calculate()
        {
            mathEval(displayElemen.value);
        }

    </script>
</body>
</html>
