<html lang="en">
<head>

</head>
<body>
    <h1>
        Belajar Javascript
    </h1>
    <div id="hasil">

    </div>    
    <script>
        var warna = "merah";
        switch (warna) {
            case "hitam":
                var teks = "warna hitam";
                break;
            case "merah":
                var teks = "Warna merah";
